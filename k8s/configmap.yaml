# Non-secret configuration for the service app, mirroring the env contract in
# docs/PORTING.md. Values are the template's dev defaults, so the whole set
# applies to a cluster whose `db`, `cache` and `rabbitmq` Services exist.
# Real deployments move the credentials (`*_PASSWORD`, the DATABASE_URL
# userinfo) into a Secret and reference it from the Deployment alongside this
# ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rust-template-config
  labels:
    app.kubernetes.io/name: rust-template
data:
  APP_ENV: production
  API_PORT: "3000"

  # Postgres. DATABASE_URL is the value the app reads; the parts stay for
  # parity with the committed env files and compose overrides.
  DATABASE_URL: postgres://dev:admin123@db:5432/fastify
  DATABASE_PORT: "5432"
  DATABASE_DB: fastify
  DATABASE_USERNAME: dev
  DATABASE_PASSWORD: admin123

  # Cache (Valkey)
  CACHE_DISABLED: "false"
  CACHE_HOST: cache
  CACHE_PORT: "6379"
  CACHE_PASSWORD: admin123

  # RabbitMQ
  RABBIT_DISABLED: "false"
  RABBIT_HOST: rabbitmq
  RABBIT_PORT: "5672"
  RABBIT_TRANSPORT: amqp
  RABBIT_USER: guest
  RABBIT_PASSWORD: guest

  # Worker defaults (a service adds a consumer deployment; see PORTING.md)
  WORKER_QUEUE: task_queue
  WORKER_EXCHANGE: main
  WORKER_BINDING_KEY: "task.#"
  WORKER_PREFETCH: "1"

  # Logs
  REQUEST_LOG_LEVEL: info
  APP_LOG_LEVEL: info
