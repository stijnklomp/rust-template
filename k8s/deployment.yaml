# The service app Deployment (PORTING.md "Kubernetes"): plain manifests, no
# CronJob example (ADR-0009). The published image is distroless `nonroot`, and
# the pod is hardened to match: fixed non-root UID, no capabilities, read-only
# root filesystem. That is safe with APP_ENV=production (the ConfigMap value):
# the app only writes openapi.yaml on non-production startup (ADR-0004).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-template
  labels:
    app.kubernetes.io/name: rust-template
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rust-template
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rust-template
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: app
          # Replace with the tag (or better, the digest) that
          # `just docker-publish` pushed.
          image: rust-template:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: rust-template-config
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
