# cargo-nextest repository configuration (ADR-0010: the `just` recipes are
# the gates; `just test`, `just test-component`, `just test-spec` and
# `just test-blackbox` are the entry points).
#
# Suite layout (ADR-0012):
#
#   `just test`            nextest default profile: unit + feature tests, no
#                          infrastructure (`cargo nextest run` + `cargo test
#                          --doc`). The component binary is filtered out.
#   `just test-component`  nextest `component` profile: this service against
#                          real Postgres/Valkey/RabbitMQ, serial because the
#                          tests share one stack.
#   `just test-spec`       `cargo test --features spec --test spec`: the
#                          Cucumber spec suite, in-process and concurrent.
#   `just test-blackbox`   the same target with `SPEC_TARGET` set: serial,
#                          against a deployed service.
#
# Plain `cargo test` runs the fast suite plus the component tests (they are not
# feature-gated; run them with the infra stack up), and nothing from the spec
# target (feature-gated). Doctests always run through `cargo test --doc`
# because nextest has no doctest support.
#
# Cucumber uses `harness = false`, which nextest cannot list, so the spec
# target is behind its own feature and never reaches these profiles.

# Oldest nextest this configuration is written for.
nextest-version = "0.9.148"

[profile.default]
# Everything except the real-infrastructure component tests: the fast suite
# needs no infrastructure (Postgres is only needed for `just sqlx-check`).
default-filter = "not (binary(component))"

[profile.component]
# Real-infrastructure suites: one database and one broker are shared by every
# test, so run serially and report every failure.
default-filter = "binary(component)"
test-threads = 1
fail-fast = false
